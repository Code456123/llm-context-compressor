[project]
name = "smart-context-compression"
version = "1.0.0"
description = "Post-retrieval smart context compression with FAISS, BM25, cross-encoder reranking and adaptive LLM verification"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "faiss-cpu>=1.14.3",
    "google-genai>=2.16.0",
    "groq>=1.6.0",
    "numpy>=2.5.1",
    "openai>=2.0.0",
    "plotly>=6.9.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.7.0",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.60.0",
    "uvicorn[standard]>=0.35.0",
    "pandas>=3.0.5",
    "tiktoken>=0.14.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[tool.uv]
dev-dependencies = ["pytest>=8.4.0", "httpx>=0.28.1"]
